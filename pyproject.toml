[project]
name = "leanunit"
version = "0.2.0"
description = "Agent-first unit tests. Your agent proves laws about your Python code in Lean."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = []

[project.scripts]
leanunit = "leanunit.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/leanunit"]
exclude = ["src/leanunit/lean/.lake"]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["lean: needs the Lean toolchain, with lake on PATH"]
