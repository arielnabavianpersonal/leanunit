<!DOCTYPE html>
<html lang="en">
<head>

<title>LeanUnit checks a law</title>

<body>
<svg viewBox="0 0 960 540" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="hero-1-title hero-1-desc">
<title id="hero-1-title">LeanUnit checks a law</title>
<desc id="hero-1-desc">Two unit tests pass while a LeanUnit law about apply is checked for every input: first it is refuted with a counterexample, then after the fix it is proved, and leanunit check passes with 14 laws.</desc>
<rect width="960" height="540" fill="#f5f7fb"/>
<rect width="960" height="56" fill="#0f1b2d"/>
<text x="32" y="36" fill="#f5f7fb" font-size="20" font-weight="400" font-family="'Geist', system-ui, sans-serif" text-anchor="start">you: ship apply()</text>
<text x="48" y="112" fill="#46566e" font-size="12" font-weight="500" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start" letter-spacing="0.14em">UNIT TESTS</text>
<rect x="48" y="128" width="304" height="56" rx="8" fill="#ffffff" stroke="#0f1b2d" stroke-width="1"/>
<text x="68" y="162" fill="#0f1b2d" font-size="16" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">test_bumps_version</text>
<circle cx="324" cy="156" r="12" fill="#2563eb"/>
<text x="324" y="162" fill="#ffffff" font-size="16" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">✓</text>
<rect x="48" y="200" width="304" height="56" rx="8" fill="#ffffff" stroke="#0f1b2d" stroke-width="1"/>
<text x="68" y="234" fill="#0f1b2d" font-size="16" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">test_unknown_id_raises</text>
<circle cx="324" cy="228" r="12" fill="#2563eb"/>
<text x="324" y="234" fill="#ffffff" font-size="16" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">✓</text>
<text x="400" y="112" fill="#46566e" font-size="12" font-weight="500" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start" letter-spacing="0.14em">LAW</text>
<rect x="400" y="128" width="512" height="128" rx="8" fill="#ffffff" stroke="#0f1b2d" stroke-width="1"/>
<text x="428" y="180" fill="#0f1b2d" font-size="24" font-weight="500" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">∀ state, answers:</text>
<text x="460" y="224" fill="#0f1b2d" font-size="24" font-weight="500" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">changed → version ↑</text>
<text x="400" y="300" fill="#7a889f" font-size="16" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">checking every input…</text>
<rect y="484" width="960" height="56" fill="#0f1b2d"/>
<text x="32" y="520" fill="#8ab4ff" font-size="20" font-weight="500" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">$ leanunit check</text>
