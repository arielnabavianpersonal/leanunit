[project]
name = "nounit"
version = "0.1.0"
description = "Lean proofs instead of hand-written unit tests, locked like package-lock.json."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
nounit = "nounit.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nounit"]
exclude = ["src/nounit/lean/.lake"]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["lean: needs the Lean toolchain, with lake on PATH"]
