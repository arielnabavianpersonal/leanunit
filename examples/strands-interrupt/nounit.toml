[python]
source_root = "src"
cover = ["strands.interrupt:_InterruptState"]
exclude = ["strands.interrupt:_InterruptState.from_dict"]

[lean]
project = "lean"

[conformance]
samples = 300
seed = 1

[agent]
command = [
  "claude", "-p",
  "--permission-mode", "acceptEdits",
  "--allowedTools", "Read,Edit,Write,Glob,Grep,Bash(lake:*),Bash(nounit:*),Bash(uv run nounit:*)",
]
