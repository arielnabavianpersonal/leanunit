<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<title>leanunit check before and after the fix</title>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap" rel="stylesheet"/>

</head>
<body>
<svg viewBox="0 0 960 496" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="terminal-title terminal-desc">
<title id="terminal-title">leanunit check before and after the fix</title>
<desc id="terminal-desc">A terminal shows leanunit check failing with a refuted law, a fix to resume, and then leanunit check passing with full coverage of 9 targets.</desc>
<rect width="960" height="496" fill="#0a0a0a"/>
<rect x="32" y="32" width="896" height="432" rx="12" fill="#141414" stroke="#2b2b2b" stroke-width="1"/>
<path d="M44 32 H916 A12 12 0 0 1 928 44 V68 H32 V44 A12 12 0 0 1 44 32 Z" fill="#1b1b1b"/>
<line x1="32" y1="68" x2="928" y2="68" stroke="#2b2b2b" stroke-width="1"/>
<circle cx="56" cy="50" r="5" fill="#4f8cff"/>
<circle cx="76" cy="50" r="5" fill="#5c5c5c"/>
<circle cx="96" cy="50" r="5" fill="#5c5c5c"/>
<text x="480" y="54" fill="#9a9a9a" font-size="12" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">leanunit — strands-interrupt</text>
<text x="64" y="112" fill="#4f8cff" font-size="16" font-weight="600" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">$</text>
<text x="84" y="112" fill="#f5f5f5" font-size="16" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">leanunit check</text>
<text x="64" y="144" fill="#f5f5f5" font-size="16" font-weight="600" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">LeanUnit check: FAILED (1 finding)</text>
<text x="84" y="176" fill="#9a9a9a" font-size="16" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">[refuted_law] Laws.Interrupt.resume_bumps_version_on_change</text>
<text x="120" y="208" fill="#9a9a9a" font-size="16" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">Lean has a proof that this law is false.</text>
<text x="64" y="272" fill="#4f8cff" font-size="16" font-weight="600" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">$</text>
<text x="84" y="272" fill="#5c5c5c" font-size="16" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start"># fix resume(): validate every answer first</text>
<text x="64" y="336" fill="#4f8cff" font-size="16" font-weight="600" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">$</text>
<text x="84" y="336" fill="#f5f5f5" font-size="16" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">leanunit check</text>
<text x="64" y="368" fill="#4f8cff" font-size="16" font-weight="600" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">LeanUnit check: PASSED</text>
<text x="64" y="400" fill="#9a9a9a" font-size="16" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">Conformance samples: 2700</text>
<text x="64" y="432" fill="#9a9a9a" font-size="16" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">Coverage: 9 of 9 targets have laws. Samples executed 49 of 49 lines (100%).</text>
</svg>
