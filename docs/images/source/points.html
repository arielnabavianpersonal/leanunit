<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<title>Unit tests check points, a law checks every input</title>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap" rel="stylesheet"/>
<style>*{box-sizing:border-box;margin:0;padding:0}body{background:#f5f7fb}svg{display:block;width:960px;height:440px}</style>
</head>
<body>
<svg viewBox="0 0 960 440" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="points-title points-desc">
<title id="points-title">Unit tests check points, a law checks every input</title>
<desc id="points-desc">Unit tests check five chosen inputs and miss the bug input between them; a LeanUnit law covers the whole input space, so the same bug input is caught.</desc>
<rect width="960" height="440" fill="#f5f7fb"/>
<text x="40" y="56" fill="#46566e" font-size="12" font-weight="500" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start" letter-spacing="0.14em">UNIT TESTS</text>
<rect x="40" y="72" width="420" height="300" rx="8" fill="#e9eef7" stroke="rgba(15,27,45,0.12)" stroke-width="1"/>
<circle cx="120" cy="152" r="6" fill="#0f1b2d"/>
<circle cx="240" cy="128" r="6" fill="#0f1b2d"/>
<circle cx="376" cy="184" r="6" fill="#0f1b2d"/>
<circle cx="156" cy="284" r="6" fill="#0f1b2d"/>
<circle cx="352" cy="308" r="6" fill="#0f1b2d"/>
<circle cx="260" cy="232" r="16" fill="none" stroke="#2563eb" stroke-width="1.2" stroke-dasharray="4,3"/>
<circle cx="260" cy="232" r="8" fill="#2563eb"/>
<text x="288" y="236" fill="#2563eb" font-size="12" font-weight="600" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start" letter-spacing="0.06em">missed</text>
<text x="500" y="56" fill="#46566e" font-size="12" font-weight="500" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start" letter-spacing="0.14em">LEANUNIT LAW</text>
<rect x="500" y="72" width="420" height="300" rx="8" fill="rgba(37,99,235,0.10)" stroke="#2563eb" stroke-width="1"/>
<text x="524" y="128" fill="#2563eb" font-size="40" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="start" opacity="0.5">∀</text>
<circle cx="580" cy="152" r="6" fill="#0f1b2d"/>
<circle cx="700" cy="128" r="6" fill="#0f1b2d"/>
<circle cx="836" cy="184" r="6" fill="#0f1b2d"/>
<circle cx="616" cy="284" r="6" fill="#0f1b2d"/>
<circle cx="812" cy="308" r="6" fill="#0f1b2d"/>
<circle cx="720" cy="232" r="16" fill="none" stroke="#2563eb" stroke-width="1.2" />
<circle cx="720" cy="232" r="8" fill="#2563eb"/>
<text x="748" y="236" fill="#2563eb" font-size="12" font-weight="600" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start" letter-spacing="0.06em">caught</text>
<text x="40" y="412" fill="#0f1b2d" font-size="16" font-weight="500" font-family="'Geist', system-ui, sans-serif" text-anchor="start">5 inputs checked</text>
<text x="500" y="412" fill="#0f1b2d" font-size="16" font-weight="500" font-family="'Geist', system-ui, sans-serif" text-anchor="start">every input checked</text>
</svg>
</body>
</html>
